name: Bug report
description: Report a reproducible non-sensitive defect.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here. Use a private security advisory.
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and commit
    validations:
      required: true
