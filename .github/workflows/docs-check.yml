name: Docs Integrity Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs-material==9.6.20

      - name: Build documentation
        run: mkdocs build --clean --strict

      - name: Verify critical routes
        run: |
          test -f site/index.html
          test -f site/assets/stylesheets/extra.css
          test -f site/assets/1kusd-social-card.png
          test -f site/security/index.html
          test -f site/roadmap/index.html
          test -f site/whitepaper/WHITEPAPER_1kUSD_EN/index.html
          test -f site/whitepaper/WHITEPAPER_1kUSD_DE/index.html
